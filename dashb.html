<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaanBayan — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar expanded" id="sidebar">

    <div class="sidebar-top">
      <div class="sidebar-brand">
        <img class="logo-icon" src="assets/icons/favuser.svg" width="26" height="26" alt="LaanBayan Logo">
        <span class="sidebar-brand-text">Laan<span class="bayan">Bayan</span></span>
      </div>

      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
        <img src="assets/icons/option.svg" width="20" height="20" alt="Toggle Options">
        <span class="sidebar-toggle-text">Options</span>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="sidebar-link active" data-page="dashboard">
        <img src="assets/icons/dashboard.svg" width="20" height="20" alt="Dashboard">
        <span>Dashboard</span>
      </a>

      <a href="#" class="sidebar-link" data-page="queue">
        <img src="assets/icons/queue.svg" width="20" height="20" alt="My Queue">
        <span>My Queue</span>
      </a>

      <a href="#" class="sidebar-link" data-page="about">
        <img src="assets/icons/message.svg" width="20" height="20" alt="About">
        <span>About</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="sidebar-divider"></div>

      <div class="sidebar-user">
        <img src="assets/icons/user.svg" width="20" height="20" alt="User Profile">
        <div class="sidebar-user-info">
          <span class="sidebar-user-name">Juan Dela Cruz</span>
          <span class="sidebar-user-role">Resident</span>
        </div>
      </div>

      <a href="index.html" class="sidebar-link sidebar-signout" id="signOutLink">
        <img src="assets/icons/log-out.svg" width="20" height="20" alt="Sign Out">
        <span>Sign out</span>
      </a>
    </div>
    
  </aside>

  <main class="dash-main" id="dashMain">
    <div class="dash-content">
  <header class="dash-header">
    <div class="dash-heading">
      <h1 class="dash-greeting">Maganda-araw, <span class="dash-username">Juan</span>!</h1>
      <p class="dash-subtitle">Here, you can schedule your appointments and view announcements by the Barangay.</p>
    </div>
    <time class="dash-clock" id="dashClock"></time>
  </header>

</div>
  </main>

</div>

<script src="js/script.js"></script>
</body>
</html>
